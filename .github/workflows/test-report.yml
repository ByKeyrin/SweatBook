name: Test Report

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Le job doit pouvoir pousser le rapport de tests sur la branche
permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          # Le client (Vite) et le futur serveur ont leurs propres dépendances
          if [ -f client/package-lock.json ]; then npm ci --prefix client; fi
          if [ -f server/package-lock.json ]; then npm ci --prefix server; fi

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start API server (si présent)
        run: |
          if [ -f server/package.json ]; then
            nohup npm run dev --prefix server > /tmp/server.log 2>&1 &
            for i in $(seq 1 30); do
              curl -sf http://localhost:3001/api/health > /dev/null && break
              sleep 2
            done
          else
            echo "::warning::Dossier server/ absent : les tests API et E2E échoueront (pas de serveur à tester)."
          fi

      - name: Run API tests
        run: npm run test -- --run --reporter=json --outputFile=test-report-api.json
        continue-on-error: true

      - name: Run E2E tests
        run: npm run test:e2e -- --reporter=json
        env:
          # Le reporter JSON de Playwright écrit dans ce fichier
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-report-e2e.json
        continue-on-error: true

      - name: Generate test report
        run: |
          node scripts/generate-test-report.js

      - name: Commit test report
        # Sur pull_request le checkout est en HEAD détaché : on ne pousse
        # le rapport qu'à chaque push (la demande de Kevin).
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add test-report.md
          git diff --staged --quiet || git commit -m "test: update test report [skip ci]"
          git push
